<div class="actions">
  @if (isLoading) {
    <app-spinner></app-spinner>
  }
</div>
<app-table
  title="{{ 'listings.listing-list.title' | translate }}"
  [columns]="columns"
  [data]="listings"
  (selectionChange)="onSelectionChange($event)"
  (edit)="onEdit($event)"
  (delete)="deleteListing($event)"
  (import)="importListing($event)"
  [showEdit]="true"
  [showDelete]="true"
  [total]="listings.length"
    [showImport]="true"
  (addNew)="onAddNew()"
  (search)="onSearch($event)"
  [searchPlaceholder]="'listings.listing-list.search-placeholder' | translate"
></app-table>
