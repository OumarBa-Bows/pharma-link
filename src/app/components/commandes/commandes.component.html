<div class="actions">
  @if (isLoading) {
    <app-spinner></app-spinner>
  }
</div>
<app-table
  title="{{ 'commands.commands-list.title' | translate }}"
  [columns]="columns"
  [data]="commandData"
  (selectionChange)="onSelectionChange($event)"
  (showDetatail)="showDetail($event)"
  [showAddButton]="false"
  [showEdit]="false"
  [showDelete]="false"
  [showImport]="false"
  [showDetails]="true"
  [total]="commandData?.length"
  [searchPlaceholder]="'commands.commands-list.search-placeholder' | translate"
></app-table>
