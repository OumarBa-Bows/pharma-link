<div class="modal-header">
  <h5 class="modal-title">Changer le statut</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <p>Statut actuel : <strong>{{ currentStatus }}</strong></p>

  <label for="statusSelect" class="form-label mt-2">Nouveau statut :</label>
  <select id="statusSelect" class="form-select" [(ngModel)]="selectedStatus">
    @for (status of statuses; track status) {
      <option [value]="status">{{ status }}</option>
    }
  </select>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
  <button type="button" class="btn btn-primary" (click)="confirmChange()">Valider</button>
</div>
