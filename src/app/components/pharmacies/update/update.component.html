<div class="row">
  @if (isLoading) {
    <app-spinner></app-spinner>
  }
  <div class="col-xl-12">
    <button style="float: right" [routerLink]="['/pharmacy/index']" class="btn btn-danger mb-4">
      <i class="fa fa-arrow-left"></i>
      {{ 'buttons-action.back' | translate }}
    </button>
  </div>
  <div class="col-xl-12">
    <app-card cardTitle="{{ 'pharmacies.pharmacy-update.title' | translate }}" [options]="false" blockClass="table-border-style">
      <form [formGroup]="pharmacyForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="code" class="form-label">Code</label>
            <input type="text" class="form-control" id="code" formControlName="code" placeholder="Code de la pharmacie" />
          </div>
           <div class="col-md-6 mb-3">
            <label for="state" class="form-label">Statut</label>
             <select class="form-select" name="state" id="state" formControlName="state">
              <option value="">Sélectionnez un statut</option>
              <option value="PENDING">EN ATTENTE</option>
              <option value="ACTIVE">ACTIVE</option>
              <option value="BLOCKED">BLOQUE</option>
             </select>
          </div>

        </div>
        <div class="row">
           <div class="col-md-6 mb-3">
            <label for="name" class="form-label">Nom</label>
            <input type="text" class="form-control" id="name" formControlName="name" placeholder="Nom de la pharmacie" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="customerType" class="form-label">Type</label>
            <select class="form-select" id="customerType" formControlName="customerType">
              <option value="">Sélectionnez un type</option>
              <option value="PHARMACY">PHARMACIE</option>
              <option value="DEPOT">DEPOT</option>
            </select>
          </div>

        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="phone" class="form-label">Telephone</label>
            <input type="number" class="form-control" id="phone" formControlName="phone" placeholder="Telephone de la pharmacie" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="address" class="form-label">Adresse</label>
            <input type="text" class="form-control" id="address" formControlName="address" placeholder="Adresse de la pharmacie" />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="managerName" class="form-label">Nom du gerant</label>
            <input type="text" class="form-control" id="managerName" formControlName="managerName" placeholder="Nom du gerant" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="managerPhone" class="form-label">Telephone du gerant</label>
            <input type="text" class="form-control" id="managerPhone" formControlName="managerPhone" placeholder="Telephone du gerant" />
          </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
            <label for="doctorName" class="form-label">Nom du docteur</label>
            <input type="text" class="form-control" id="doctorName" formControlName="doctorName" placeholder="Nom du docteur" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="doctorPhone" class="form-label">Telephone du docteur</label>
            <input type="text" class="form-control" id="doctorPhone" formControlName="doctorPhone" placeholder="Telephone du docteur" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="pharmacyForm.invalid">Enregistrer</button>
      </form>
    </app-card>
  </div>
</div>
