<div class="actions">
  @if (isLoading) {
    <app-spinner></app-spinner>
  }
</div>
<app-table
  title="{{ 'categories.category-list.title' | translate }}"
  [columns]="columns"
  [data]="displayedCategories"
  (selectionChange)="onSelectionChange($event)"
  (edit)="onEdit($event)"
  [showEdit]="true"
  [total]="displayedCategories.length"
  (addNew)="onAddNew()"
  (search)="onSearch($event)"
  [searchPlaceholder]="'common.search' | translate"
></app-table>
