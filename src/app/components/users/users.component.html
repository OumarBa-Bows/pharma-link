<div class="actions">
  <button type="submit" class="btn btn-success mb-4" (click)="addUser()">
    <i class="fa fa-plus"></i>
    {{ 'buttons-action.add' | translate }}
  </button>
</div>
<app-table
  title="{{ 'users.user-list.title' | translate }}"
  [columns]="columns"
  [data]="users"
  (selectionChange)="onSelectionChange($event)"
  (edit)="editUser($event)"
  (delete)="deleteUser($event)"
  [showEdit]="true"
  [showDelete]="true"
  [showSelected]="false"
></app-table>
