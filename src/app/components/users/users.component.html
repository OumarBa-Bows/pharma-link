<div class="actions"></div>
<app-table
  title="{{ 'users.user-list.title' | translate }}"
  [columns]="columns"
  [data]="users"
  (selectionChange)="onSelectionChange($event)"
  (edit)="editUser($event)"
  (delete)="deleteUser($event)"
  [showEdit]="true"
  [showDelete]="true"
  (addNew)="addUser()"
  [showSelected]="false"
  [searchPlaceholder]="'common.search' | translate"
></app-table>
