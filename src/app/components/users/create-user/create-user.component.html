<app-card cardTitle="{{ title | translate }}" [options]="false">
  <hr />
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label for="nom">{{ 'common.name' | translate }}</label>
          <input type="text" class="form-control" id="nom" [placeholder]="'users.namePlaceholder' | translate" formControlName="name" />
          <div *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid" class="text-danger small">
            {{ 'users.nameRequired' | translate }}
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group mb-3">
          <label for="email">{{ 'common.email' | translate }}</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [placeholder]="'users.emailPlaceholder' | translate"
            formControlName="email"
          />
          <div *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid" class="text-danger small">
            <span *ngIf="userForm.get('email')?.errors?.['required']">{{ 'users.emailRequired' | translate }}</span>
            <span *ngIf="userForm.get('email')?.errors?.['email']">{{ 'users.emailInvalid' | translate }}</span>
          </div>
        </div>
      </div>
      @if (!user) {
        <div class="col-md-6">
          <div class="form-group mb-3">
            <label for="password">{{ 'users.password' | translate }}</label>
            <input type="text" class="form-control" id="password" formControlName="password" />
            <div *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid" class="text-danger small">
              <span *ngIf="userForm.get('password')?.errors?.['required']">{{ 'users.passwordRequired' | translate }}</span>
              <span *ngIf="userForm.get('password')?.errors?.['minlength']">{{ 'users.passwordMinLength' | translate }}</span>
            </div>
          </div>
        </div>
      }
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label>{{ 'users.my_roles' | translate }}</label>
          <div class="border rounded p-3">
            @for (role of roles; track role.id) {
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'role-' + role.id"
                  [checked]="isRoleSelected(role.name)"
                  (change)="onRoleChange(role.name, $event)"
                />
                <label class="form-check-label" [for]="'role-' + role.id">
                  {{ getRoleTranslation(role.name) }}
                </label>
              </div>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-primary" (click)="closeModal()" [disabled]="isSubmitting">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="submit" class="btn btn-success" [disabled]="userForm.invalid || isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? ('users.loading' | translate) : ('users.validate' | translate) }}
      </button>
    </div>
  </form>
</app-card>
