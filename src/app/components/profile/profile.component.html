<div class="container mt-4">
  <div class="card shadow-sm p-4">
    <div class="d-flex align-items-center mb-3 flex-wrap gap-2">
      <i class="feather icon-user fs-4 text-primary"></i>
      <h3 class="m-0">Profil utilisateur</h3>
    </div>

    <!-- ✅ Ajout du wrapper responsive -->
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <tbody>
        <tr>
          <th scope="row">Nom</th>
          <td>{{ user.name }}</td>
        </tr>
        <tr>
          <th scope="row">Email</th>
          <td>{{ user.email }}</td>
        </tr>
        <tr>
          <th scope="row">Date de création</th>
          <td>{{ user.createdAt | date: 'short' }}</td>
        </tr>
        <tr>
          <th scope="row">Dernière mise à jour</th>
          <td>{{ user.updatedAt | date: 'short' }}</td>
        </tr>
        <tr *ngIf="user.roles?.length">
          <th scope="row">Rôles</th>
          <td>
              <span *ngFor="let role of user.roles" class="badge bg-primary me-1 mb-1">
                {{ role.name }}
              </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3 text-end">
      <button class="btn btn-outline-primary" (click)="openCreationModal()">
        <i class="feather icon-edit"></i> Modifier
      </button>
    </div>
  </div>

  <div class="card shadow-sm p-4 mt-4">
    <h4 class="mb-3">
      <i class="feather icon-lock text-secondary"></i> Changer le mot de passe
    </h4>

    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <div class="mb-3">
        <label for="oldPassword" class="form-label">Ancien mot de passe</label>
        <input
          type="text"
          id="oldPassword"
          [(ngModel)]="currentPassword"
          class="form-control"
          name="currentPassword"
          required
        />
      </div>

      <div class="mb-3">
        <label for="newPassword" class="form-label">Nouveau mot de passe</label>
        <input
          type="text"
          id="newPassword"
          class="form-control"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
        />
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input
          type="text"
          id="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
        />
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-primary">
          <i class="feather icon-refresh-ccw"></i> Mettre à jour
        </button>
      </div>

      @if (passwordChanged){
        <div  class="alert alert-success mt-3 mb-0">
          ✅ Mot de passe changé avec succès !
        </div>
      }
    </form>
  </div>
</div>
