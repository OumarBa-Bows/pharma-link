<div class="row">
  <div class="col-xl-12">
    <app-card [cardTitle]="title" [options]="false" blockClass="table-border-style">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
          <tr>
            <th>
              <div class="table-selection">
                <input type="checkbox" [checked]="allSelected" (change)="toggleAll($event)" />
                <span>{{ 'table.selectAll' | translate }}</span>
              </div>
            </th>
            @for (col of columns; track $index) {
              <th>{{ col.header }}</th>
            }
          </tr>
          </thead>
          <tbody>
            @for (row of pagedData; track $index; let i = $index) {
              <tr>
                <td>
                  <!-- offset + i = index global dans data -->
                  <input
                    type="checkbox"
                    [checked]="selectedRows.has(offset + i)"
                    (change)="toggleRow(offset + i)"
                  />
                </td>
                @for (col of columns; track $index) {
                  <td>{{ row[col.field] }}</td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    </app-card>

    <nav aria-label="Page navigation">
      @if (totalPages > 1) {
        <ul class="pagination justify-content-end">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button type="button" class="page-link" (click)="goToPage(currentPage - 1)">
              &laquo;
            </button>
          </li>
          @for (p of pages; track p) {
            <li class="page-item" [class.active]="currentPage === p">
              <button type="button" class="page-link" (click)="goToPage(p)">
                {{ p }}
              </button>
            </li>
          }
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button type="button" class="page-link" (click)="goToPage(currentPage + 1)">
              &raquo;
            </button>
          </li>
        </ul>
      }
    </nav>

  </div>
</div>
