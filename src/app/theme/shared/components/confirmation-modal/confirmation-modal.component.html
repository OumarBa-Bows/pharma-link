<app-card [cardTitle]="title | translate" [options]="false">
  <div class="text-confirm">
    {{ msg | translate }}
  </div>
  <div class="text-end">
    <button type="submit" class="btn btn-sm btn-primary" (click)="closeModal()">{{ cancelLabel | translate }}</button>
    <button type="submit" class="btn btn-sm btn-danger" (click)="confirm()">{{ confirmLabel | translate }}</button>
  </div>
</app-card>
