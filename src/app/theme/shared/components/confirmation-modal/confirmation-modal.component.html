<app-card cardTitle="Confirmation" [options]="false">
    <div class="text-confirm">
      {{ msg }}
    </div>
    <div class="text-end">
      <button type="submit" class="btn btn-sm btn-primary" (click)="closeModal()">Cancel</button>
      <button type="submit" class="btn  btn-sm btn-danger" (click)="confirm()">Confirm</button>
    </div>
</app-card>
