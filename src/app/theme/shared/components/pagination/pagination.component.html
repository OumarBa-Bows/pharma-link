<nav aria-label="Pagination">
  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="!canPrev">
      <button class="page-link" (click)="prev()" [disabled]="!canPrev" aria-label="Previous">
        <span aria-hidden="true">&laquo;</span>
      </button>
    </li>

    <li class="page-item" *ngFor="let p of pages()" [class.active]="p === page">
      <button class="page-link" (click)="goTo(p)">{{ p }}</button>
    </li>

    <li class="page-item" [class.disabled]="!canNext">
      <button class="page-link" (click)="next()" [disabled]="!canNext" aria-label="Next">
        <span aria-hidden="true">&raquo;</span>
      </button>
    </li>
  </ul>
</nav>
