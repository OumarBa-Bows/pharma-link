<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-unlock auth-icon"></i>
        </div>
        <h3 class="mb-4">{{ 'login.title'| translate }}</h3>

        <form [formGroup]="loginForm" (ngSubmit)="signIn()">
          <div class="input-group mb-3">
            <input type="email" class="form-control" placeholder="{{'login.email'|translate}}" formControlName="email" required />
          </div>
          <div class="input-group mb-4">
            <input type="password" class="form-control" placeholder="{{'login.password'|translate}}" formControlName="password" required />
          </div>
          <button type="submit" class="btn btn-primary mb-4" [disabled]="loginForm.invalid">{{ 'login.loginButton'|translate }}</button>
        </form>

        <p class="mb-2 text-muted">
          {{'login.forgotPassword' |translate}}
          <a href="javascript:">{{ 'login.reset'|translate }}</a>
        </p>
        <p class="mb-0 text-muted">
          {{'login.noAccount'|translate }}
          <a [routerLink]="['/register']">{{ 'login.register'|translate }}</a>
        </p>
      </div>
    </div>
  </div>
</div>
