<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="form" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input class="form-control" formControlName="name" placeholder="Pharmacy name" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Code</label>
      <input class="form-control" formControlName="code" placeholder="e.g. GLP-001" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Type</label>
      <input class="form-control" formControlName="type" placeholder="e.g. Retail, Hospital, Clinic" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input class="form-control" formControlName="phoneNumber" placeholder="Phone" />
    </div>
    <div class="col-12">
      <label class="form-label">Address</label>
      <input class="form-control" formControlName="address" placeholder="Street, number, city" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Manager Name</label>
      <input class="form-control" formControlName="managerName" placeholder="Manager" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Doctor Name</label>
      <input class="form-control" formControlName="doctorName" placeholder="Doctor" />
    </div>
  </form>
</div>
<div class="modal-footer">
  <button class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
  <button class="btn btn-success" [disabled]="form.invalid" (click)="submit()">Save</button>
</div>
