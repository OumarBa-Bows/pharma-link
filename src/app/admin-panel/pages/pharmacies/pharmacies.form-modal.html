<div class="modal-header">
  <h5 class="modal-title">{{ title }}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="form" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name <span class="text-danger">*</span></label>
      <input class="form-control" formControlName="name" placeholder="Pharmacy name" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Code <span class="text-danger">*</span></label>
      <input class="form-control" formControlName="code" placeholder="Unique code" required />
    </div>
    <div class="col-12">
      <label class="form-label">Address <span class="text-danger">*</span></label>
      <input class="form-control" formControlName="address" placeholder="Full address" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" placeholder="Email address" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Status <span class="text-danger">*</span></label>
      <select class="form-select" formControlName="state" required>
        <option [ngValue]="PharmacyState.ACTIVE">Active</option>
        <option [ngValue]="PharmacyState.PENDING">Pending</option>
        <option [ngValue]="PharmacyState.BLOCKED">Blocked</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Customer Type <span class="text-danger">*</span></label>
      <select class="form-select" formControlName="customerType" required>
        <option [ngValue]="CustomerType.PHARMACY">Pharmacy</option>
        <option [ngValue]="CustomerType.DEPOT">Depot</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Zone</label>
      <select class="form-select" formControlName="zoneId">
        <option [ngValue]="null">Select a zone</option>
        <option *ngFor="let zone of zones" [ngValue]="zone.id">{{zone.name}}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Doctor Name</label>
      <input class="form-control" formControlName="doctorName" placeholder="Doctor's name" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Manager Name</label>
      <input class="form-control" formControlName="managerName" placeholder="Manager's name" />
    </div>
    <div class="col-12">
      <label class="form-label">Location</label>
      <input class="form-control" formControlName="location" placeholder="Location coordinates or description" />
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
  <button type="button" class="btn btn-success" [disabled]="form.invalid" (click)="submit()">
    <i class="fas fa-save me-1"></i> Save
  </button>
</div>
