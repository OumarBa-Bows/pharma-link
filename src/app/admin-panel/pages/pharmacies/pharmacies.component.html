<div class="row">
  <div class="col-12">
    <app-card [hidHeader]="false" cardTitle="Pharmacies">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="onAddNew()">
            <i class="feather icon-plus me-1"></i> Add Pharmacy
          </button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <input class="form-control" style="width: 320px" placeholder="Search name, code, type, manager, doctor, phone..." (input)="onSearch($any($event.target).value)" />
          <div class="text-muted small">Total: {{ store.total() }}</div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>Type</th>
              <th>Phone</th>
              <th>Manager</th>
              <th>Doctor</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of store.items()">
              <td>
                <div class="fw-semibold">{{ p.name }}</div>
                <div class="text-muted small">{{ p.address }}</div>
              </td>
              <td>{{ p.code }}</td>
              <td>{{ p.type }}</td>
              <td>{{ p.phoneNumber }}</td>
              <td>{{ p.managerName }}</td>
              <td>{{ p.doctorName }}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-2" (click)="onEdit(p.id)">
                  <i class="feather icon-edit-2"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="onDelete(p.id)">
                  <i class="feather icon-trash-2"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end mt-3">
        <app-pagination [total]="store.total()" [page]="store.page()" [pageSize]="store.pageSize()" (pageChange)="onPageChange($event)"></app-pagination>
      </div>

    </app-card>
  </div>
</div>
