<app-page-header title="Pharmacies">
  @if (isLoading) {
    <app-spinner></app-spinner>
  }
  <button (click)="onAddNew()" class="btn btn-success">
    <i class="fa fa-plus"></i>
    {{ 'buttons-action.add' | translate }}
  </button>
</app-page-header>

<!-- Pharmacy Form Modal -->
<ng-template #pharmacyForm let-modal>
  <div class="modal-header">
    <h5 class="modal-title">{{ editingId() ? 'Edit' : 'Add New' }} Pharmacy</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Name *</label>
          <input type="text" class="form-control" formControlName="name">
          <div class="invalid-feedback" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            Name is required
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Code *</label>
          <input type="text" class="form-control" formControlName="code">
          <div class="invalid-feedback" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
            Code is required
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address *</label>
        <input type="text" class="form-control" formControlName="address">
        <div class="invalid-feedback" *ngIf="form.get('address')?.invalid && form.get('address')?.touched">
          Address is required
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Zone *</label>
          <select class="form-select" formControlName="zoneId">
            <option value="">Select Zone</option>
            <option *ngFor="let zone of zones" [value]="zone.id">{{ zone.name }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="form.get('zoneId')?.invalid && form.get('zoneId')?.touched">
            Zone is required
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type *</label>
          <select class="form-select" formControlName="customerType">
            <option *ngFor="let type of customerTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Doctor Name</label>
          <input type="text" class="form-control" formControlName="doctorName">
        </div>
        <div class="col-md-6">
          <label class="form-label">Manager Name</label>
          <input type="text" class="form-control" formControlName="managerName">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email">
          <div class="invalid-feedback" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Please enter a valid email
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Location (lat, lng)</label>
          <input type="text" class="form-control" formControlName="location" placeholder="e.g., 36.7538,3.0588">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel(); modal.dismiss()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ editingId() ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</ng-template>

<!-- Status Update Modal -->
<ng-template #statusModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Update Pharmacy Status</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="statusForm" (ngSubmit)="updateStatus()">
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" formControlName="state">
          <option *ngFor="let state of pharmacyStates" [value]="state">{{ state }}</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Reason (optional)</label>
        <textarea class="form-control" formControlName="reason" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="statusForm.invalid || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Update Status
        </button>
      </div>
    </form>
  </div>
</ng-template>

<app-table
  title="Pharmacies"
  [columns]="columns"
  [data]="store.items()"
  (selectionChange)="onSelectionChange($event)"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  [showEdit]="true"
  [showDelete]="true"
  [showStatus]="true"
  (statusChange)="onStatusChange($event)"
  [total]="store.total()"
  (addNew)="onAddNew()"
  (search)="onSearch($event)"
  [searchPlaceholder]="'Search pharmacies...'"
  [page]="store.page()"
  [pageSize]="store.pageSize()"
  (pageChange)="onPageChange($event)">
  
  <!-- Custom status badge template -->
  <ng-template #statusTpl let-row="row">
    <span class="badge" [ngClass]="{
      'bg-success': row.state === 'ACTIVE',
      'bg-warning': row.state === 'PENDING',
      'bg-danger': row.state === 'BLOCKED'
    }">
      <i class="fas me-1" [ngClass]="{
        'fa-check-circle': row.state === 'ACTIVE',
        'fa-clock': row.state === 'PENDING',
        'fa-ban': row.state === 'BLOCKED'
      }"></i>
      {{ row.state }}
    </span>
  </ng-template>
  
  <!-- Custom zone template -->
  <ng-template #zoneTpl let-row="row">
    {{ row.zone?.name || 'N/A' }}
  </ng-template>
</app-table>
