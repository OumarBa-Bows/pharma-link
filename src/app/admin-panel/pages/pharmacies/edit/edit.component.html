<div class="row">

  <div class="col-xl-12">
    <button style="float: right" [routerLink]="['/pharmacies']" class="btn btn-primary mb-4">
      <i class="fa fa-arrow-left"></i>
      {{ 'buttons-action.back' | translate }}
    </button>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <!-- <button type="button" class="btn btn-sm btn-outline-secondary me-2" (click)="goBack()">
              <i class="fa fa-arrow-left me-1"></i> Back
            </button> -->
            <h4 class="d-inline-block mb-0">Edit Pharmacy</h4>
          </div>
        </div>
      </div>
      <div class="card-body">
        <form [formGroup]="pharmacyForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" formControlName="name" [class.is-invalid]="pharmacyForm.get('name')?.invalid && pharmacyForm.get('name')?.touched">
              <div class="invalid-feedback" *ngIf="pharmacyForm.get('name')?.hasError('required')">
                Name is required
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="code" class="form-label">Code <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="code" formControlName="code" [class.is-invalid]="pharmacyForm.get('code')?.invalid && pharmacyForm.get('code')?.touched">
              <div class="invalid-feedback" *ngIf="pharmacyForm.get('code')?.hasError('required')">
                Code is required
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="phoneNumber" formControlName="phoneNumber" [class.is-invalid]="pharmacyForm.get('phoneNumber')?.invalid && pharmacyForm.get('phoneNumber')?.touched">
              <div class="invalid-feedback" *ngIf="pharmacyForm.get('phoneNumber')?.hasError('required')">
                Phone number is required
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="type" formControlName="type" [class.is-invalid]="pharmacyForm.get('type')?.invalid && pharmacyForm.get('type')?.touched">
              <div class="invalid-feedback" *ngIf="pharmacyForm.get('type')?.hasError('required')">
                Type is required
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12 mb-3">
              <label for="address" class="form-label">Address <span class="text-danger">*</span></label>
              <textarea class="form-control" id="address" formControlName="address" rows="2" [class.is-invalid]="pharmacyForm.get('address')?.invalid && pharmacyForm.get('address')?.touched"></textarea>
              <div class="invalid-feedback" *ngIf="pharmacyForm.get('address')?.hasError('required')">
                Address is required
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="managerName" class="form-label">Manager Name</label>
              <input type="text" class="form-control" id="managerName" formControlName="managerName">
            </div>
            <div class="col-md-6 mb-3">
              <label for="doctorName" class="form-label">Doctor Name</label>
              <input type="text" class="form-control" id="doctorName" formControlName="doctorName">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" (click)="goBack()" [disabled]="isLoading">
              <i class="fa fa-times me-1"></i> Cancel
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="pharmacyForm.invalid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
              <i class="fa fa-save me-1"></i>{{ isLoading ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
