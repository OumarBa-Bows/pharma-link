<form [formGroup]="form" (ngSubmit)="onSubmit()" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Name <span class="text-danger">*</span></label>
    <input type="text" class="form-control" formControlName="name" placeholder="Enter pharmacy name" required>
    <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger">
      Name is required
    </div>
  </div>

  <div class="col-md-6">
    <label class="form-label">Code <span class="text-danger">*</span></label>
    <input type="text" class="form-control" formControlName="code" placeholder="Enter pharmacy code" required>
    <div *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="text-danger">
      Code is required
    </div>
  </div>

  <div class="col-12">
    <label class="form-label">Address <span class="text-danger">*</span></label>
    <input type="text" class="form-control" formControlName="address" placeholder="Enter full address" required>
    <div *ngIf="form.get('address')?.invalid && form.get('address')?.touched" class="text-danger">
      Address is required
    </div>
  </div>

  <div class="col-md-6">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" formControlName="email" placeholder="Enter email">
    <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger">
      Please enter a valid email
    </div>
  </div>

  <div class="col-md-6">
    <label class="form-label">Status <span class="text-danger">*</span></label>
    <select class="form-select" formControlName="state" required>
      <option *ngFor="let state of pharmacyStates" [ngValue]="state">
        {{ state }}
      </option>
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Customer Type <span class="text-danger">*</span></label>
    <select class="form-select" formControlName="customerType" required>
      <option *ngFor="let type of customerTypes" [ngValue]="type">
        {{ type }}
      </option>
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Zone</label>
    <select class="form-select" formControlName="zoneId">
      <option [ngValue]="null">Select a zone</option>
      <option *ngFor="let zone of zones" [ngValue]="zone.id">
        {{ zone.name }}
      </option>
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Doctor Name</label>
    <input type="text" class="form-control" formControlName="doctorName" placeholder="Enter doctor's name">
  </div>

  <div class="col-md-6">
    <label class="form-label">Manager Name</label>
    <input type="text" class="form-control" formControlName="managerName" placeholder="Enter manager's name">
  </div>

  <div class="col-12">
    <label class="form-label">Location</label>
    <input type="text" class="form-control" formControlName="location" placeholder="Enter location details">
  </div>

  <div class="col-12 mt-4 d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="isLoading">
      <i class="fas fa-times me-1"></i> Cancel
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isLoading">
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
      <i *ngIf="!isLoading" class="fas fa-save me-1"></i>
      {{ isEditing ? 'Update' : 'Save' }}
    </button>
  </div>
</form>
