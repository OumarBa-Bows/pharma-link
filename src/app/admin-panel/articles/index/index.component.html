<div class="row">
  <div class="col-xl-12">
    <app-card cardTitle="List des articles" [options]="false" blockClass="table-border-style" [customHeader]="true">
      <div class="app-card-header d-flex align-items-center justify-content-between w-100">
        <span>List des articles</span>
        <button [routerLink]="['/articles/create']" class="btn btn-primary ms-3">Ajouter un article</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Username</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">1</th>
              <td>Mark</td>
              <td>Otto</td>
              <td>&#64;mdo</td>
            </tr>
            <tr>
              <th scope="row">2</th>
              <td>Jacob</td>
              <td>Thornton</td>
              <td>&#64;fat</td>
            </tr>
            <tr>
              <th scope="row">3</th>
              <td>Larry</td>
              <td>the Bird</td>
              <td>&#64;twitter</td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
</div>
